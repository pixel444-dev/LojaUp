<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1120"/>
      <stop offset="1" stop-color="#1a1f33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6cf6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d6ff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="win"><rect x="770" y="112" width="440" height="416" rx="16"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <circle cx="1010" cy="170" r="380" fill="url(#glow1)"/>
  <circle cx="1180" cy="560" r="300" fill="url(#glow2)"/>
  <circle cx="90" cy="620" r="260" fill="url(#glow1)" opacity="0.5"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- logo + nome -->
    <rect x="80" y="112" width="88" height="88" rx="22" fill="url(#brand)"/>
    <g transform="translate(100 132) scale(2)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/>
      <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
      <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/>
      <path d="M2 7h20"/>
      <path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/>
    </g>
    <text x="192" y="190" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">LojaUp</text>

    <text x="82" y="270" font-size="32" font-weight="600" fill="#e4e6f2">Sistema de gestão para lojas de roupas</text>
    <text x="82" y="312" font-size="21" fill="#9aa1bd">Sem mensalidade · Funciona sem internet · Dados no seu computador</text>

    <!-- módulos -->
    <g font-size="17" font-weight="600" fill="#d9dcf0" text-anchor="middle">
      <rect x="82"  y="352" width="74"  height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="119" y="378">PDV</text>
      <rect x="168" y="352" width="112" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="224" y="378">Estoque</text>
      <rect x="292" y="352" width="128" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="356" y="378">Crediário</text>
      <rect x="432" y="352" width="136" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="500" y="378">Financeiro</text>

      <rect x="82"  y="404" width="136" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="150" y="430">Relatórios</text>
      <rect x="230" y="404" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="282" y="430">Backup</text>
      <rect x="346" y="404" width="124" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="408" y="430">Etiquetas</text>
      <rect x="482" y="404" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="534" y="430">Caixa</text>
    </g>

    <!-- selo open source -->
    <rect x="82" y="490" width="520" height="52" rx="26" fill="url(#brand)"/>
    <circle cx="112" cy="516" r="11" fill="none" stroke="#fff" stroke-width="2.4"/>
    <path d="M106.5 516.5l3.8 3.8 7-7.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="523" font-size="19" font-weight="700" fill="#ffffff">Open source · MIT · clone, modifique e revenda</text>

    <!-- janela do app -->
    <g filter="url(#shadow)">
      <rect x="770" y="112" width="440" height="416" rx="16" fill="#f4f5f7"/>
    </g>
    <g clip-path="url(#win)">
      <rect x="770" y="112" width="440" height="34" fill="#e6e8ee"/>
      <circle cx="792" cy="129" r="5.5" fill="#ff5f57"/>
      <circle cx="810" cy="129" r="5.5" fill="#febc2e"/>
      <circle cx="828" cy="129" r="5.5" fill="#28c840"/>
      <text x="990" y="134" font-size="12.5" font-weight="600" fill="#6b7385" text-anchor="middle">LojaUp — Painel</text>

      <!-- barra lateral -->
      <rect x="770" y="146" width="104" height="382" fill="#171b26"/>
      <rect x="784" y="160" width="22" height="22" rx="6" fill="url(#brand)"/>
      <rect x="812" y="166" width="46" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.85"/>
      <rect x="780" y="198" width="84" height="24" rx="6" fill="#2a3045"/>
      <rect x="790" y="206" width="8" height="8" rx="2" fill="#8b85ff"/>
      <rect x="804" y="207" width="48" height="6" rx="3" fill="#ffffff" fill-opacity="0.8"/>
      <g fill="#aab2c2" fill-opacity="0.45">
        <rect x="790" y="238" width="8" height="8" rx="2"/><rect x="804" y="239" width="40" height="6" rx="3"/>
        <rect x="790" y="262" width="8" height="8" rx="2"/><rect x="804" y="263" width="50" height="6" rx="3"/>
        <rect x="790" y="286" width="8" height="8" rx="2"/><rect x="804" y="287" width="36" height="6" rx="3"/>
        <rect x="790" y="310" width="8" height="8" rx="2"/><rect x="804" y="311" width="46" height="6" rx="3"/>
        <rect x="790" y="334" width="8" height="8" rx="2"/><rect x="804" y="335" width="42" height="6" rx="3"/>
        <rect x="790" y="358" width="8" height="8" rx="2"/><rect x="804" y="359" width="52" height="6" rx="3"/>
        <rect x="790" y="382" width="8" height="8" rx="2"/><rect x="804" y="383" width="38" height="6" rx="3"/>
      </g>

      <!-- cards de indicadores -->
      <g>
        <rect x="888" y="162" width="98" height="66" rx="10" fill="#fff" stroke="#e3e6ea"/>
        <rect x="900" y="176" width="44" height="6" rx="3" fill="#8a93a2" fill-opacity="0.6"/>
        <text x="900" y="210" font-size="17" font-weight="700" fill="#1c2230">R$ 4.820</text>
        <rect x="996" y="162" width="98" height="66" rx="10" fill="#fff" stroke="#e3e6ea"/>
        <rect x="1008" y="176" width="36" height="6" rx="3" fill="#8a93a2" fill-opacity="0.6"/>
        <text x="1008" y="210" font-size="17" font-weight="700" fill="#15803d">+18%</text>
        <rect x="1104" y="162" width="94" height="66" rx="10" fill="#fff" stroke="#e3e6ea"/>
        <rect x="1116" y="176" width="40" height="6" rx="3" fill="#8a93a2" fill-opacity="0.6"/>
        <text x="1116" y="210" font-size="17" font-weight="700" fill="#1c2230">37 itens</text>
      </g>

      <!-- gráfico -->
      <rect x="888" y="240" width="310" height="156" rx="10" fill="#fff" stroke="#e3e6ea"/>
      <rect x="902" y="254" width="88" height="7" rx="3.5" fill="#1c2230" fill-opacity="0.7"/>
      <g fill="url(#bar)">
        <rect x="906"  y="336" width="20" height="46" rx="4"/>
        <rect x="938"  y="318" width="20" height="64" rx="4"/>
        <rect x="970"  y="326" width="20" height="56" rx="4"/>
        <rect x="1002" y="300" width="20" height="82" rx="4"/>
        <rect x="1034" y="310" width="20" height="72" rx="4"/>
        <rect x="1066" y="288" width="20" height="94" rx="4"/>
        <rect x="1098" y="296" width="20" height="86" rx="4"/>
        <rect x="1130" y="276" width="20" height="106" rx="4"/>
        <rect x="1162" y="284" width="20" height="98" rx="4" fill="#a855f7"/>
      </g>

      <!-- lista de alertas -->
      <rect x="888" y="408" width="310" height="108" rx="10" fill="#fff" stroke="#e3e6ea"/>
      <circle cx="906" cy="430" r="5" fill="#c2261d"/>
      <rect x="918" y="427" width="150" height="6" rx="3" fill="#5a6372" fill-opacity="0.55"/>
      <rect x="1146" y="425" width="40" height="10" rx="5" fill="#fdecea"/>
      <line x1="900" y1="446" x2="1186" y2="446" stroke="#eef0f3"/>
      <circle cx="906" cy="462" r="5" fill="#b45309"/>
      <rect x="918" y="459" width="120" height="6" rx="3" fill="#5a6372" fill-opacity="0.55"/>
      <rect x="1146" y="457" width="40" height="10" rx="5" fill="#fdf3e2"/>
      <line x1="900" y1="478" x2="1186" y2="478" stroke="#eef0f3"/>
      <circle cx="906" cy="494" r="5" fill="#15803d"/>
      <rect x="918" y="491" width="136" height="6" rx="3" fill="#5a6372" fill-opacity="0.55"/>
      <rect x="1146" y="489" width="40" height="10" rx="5" fill="#e8f6ee"/>
    </g>
  </g>
</svg>
